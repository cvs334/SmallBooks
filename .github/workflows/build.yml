name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # Windows, because the desktop app is a .NET MAUI Windows app.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the .NET MAUI workload
        run: dotnet workload install maui-windows

      - name: Build every project
        run: dotnet build SmallBooks.slnx -c Release

      - name: Run tests
        run: dotnet test --project tests/SmallBooks.Tests -c Release --no-build
